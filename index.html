<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Coba Pencet!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      background:
        radial-gradient(ellipse at 20% 15%, rgb(124 58 237 / 24%), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgb(14 165 233 / 18%), transparent 36%),
        #111827;
    }

    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 5vh, 48px) clamp(20px, 6vw, 80px);
      text-align: center;
      background: rgb(31 41 55 / 55%);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #c4b5fd;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.4rem);
      letter-spacing: -0.05em;
    }

    .intro {
      max-width: 390px;
      margin: 16px auto 0;
      color: #cbd5e1;
      line-height: 1.65;
    }

    .play-area {
      position: relative;
      flex: 1;
      min-height: 220px;
      margin-top: 28px;
      border: 1px dashed rgb(255 255 255 / 18%);
      border-radius: 20px;
      background: rgb(15 23 42 / 35%);
      overflow: hidden;
      touch-action: manipulation;
    }

    #dodge-button {
      position: absolute;
      top: 50%;
      left: 50%;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      box-shadow: 0 8px 24px rgb(124 58 237 / 40%);
      color: white;
      font: inherit;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: left 150ms ease-out, top 150ms ease-out, filter 150ms ease;
    }

    #dodge-button:hover {
      filter: brightness(1.15);
    }

    #message {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: #ddd6fe;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      #dodge-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Tantangan kecil</p>
    <h1>Berani pencet?</h1>
    <p class="intro">Katanya gampang. Coba pencet tombol di bawah ini kalau bisa 😏</p>
    <div class="play-area" id="play-area">
      <button id="dodge-button" type="button">Pencet aku!</button>
    </div>
    <p id="message" aria-live="polite">Ayo, coba tangkap!</p>
  </main>

  <script>
    const playArea = document.querySelector("#play-area");
    const button = document.querySelector("#dodge-button");
    const message = document.querySelector("#message");
    let attempts = 0;
    let lastMove = 0;

    function dodge(pointerX, pointerY) {
      const now = Date.now();
      if (now - lastMove < 220) return;
      lastMove = now;

      const area = playArea.getBoundingClientRect();
      const buttonWidth = button.offsetWidth;
      const buttonHeight = button.offsetHeight;
      const padding = 12;
      const maxX = Math.max(padding, area.width - buttonWidth - padding);
      const maxY = Math.max(padding, area.height - buttonHeight - padding);
      let x = padding;
      let y = padding;

      for (let i = 0; i < 12; i += 1) {
        x = padding + Math.random() * (maxX - padding);
        y = padding + Math.random() * (maxY - padding);
        const centerX = area.left + x + buttonWidth / 2;
        const centerY = area.top + y + buttonHeight / 2;
        if (Math.hypot(centerX - pointerX, centerY - pointerY) > 115) break;
      }

      button.style.left = `${x + buttonWidth / 2}px`;
      button.style.top = `${y + buttonHeight / 2}px`;
      attempts += 1;
      message.textContent = attempts < 4
        ? "Wah, meleset! Coba lagi 😜"
        : "Hahaha, tombolnya kabur terus! 😂";
    }

    button.addEventListener("pointerenter", (event) => {
      dodge(event.clientX, event.clientY);
    });

    playArea.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;
      const buttonRect = button.getBoundingClientRect();
      const distance = Math.hypot(
        event.clientX - (buttonRect.left + buttonRect.width / 2),
        event.clientY - (buttonRect.top + buttonRect.height / 2)
      );
      if (distance < 95) dodge(event.clientX, event.clientY);
    });

    button.addEventListener("pointerdown", (event) => {
      dodge(event.clientX, event.clientY);
    });

    button.addEventListener("click", () => {
      message.textContent = "Kok bisa kepencet?! Kamu hebat! 🎉";
    });
  </script>
</body>
</html>
